# Windows actions the launcher can suggest.
#
# Each [[action]] is matched against the user's query by meaning (EmbeddingGemma 2),
# not by keywords. Fields:
#   id        unique, stable name
#   title     what the result card shows
#   about     one sentence describing what the page/tool is for (also used for matching)
#   category  groups actions; a category with a status widget (network, power, storage)
#             shows that widget when it wins
#   kind      settings | tool | command
#   open      what to launch: an ms-settings: URI, a .cpl/.msc/.exe, or a command line
#   phrases   ways people describe the problem in their own words (used for matching)
#
# Settings URIs come from Microsoft's ms-settings reference:
# https://learn.microsoft.com/windows/apps/develop/launch/launch-settings

