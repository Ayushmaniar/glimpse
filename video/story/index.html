<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glimpse launch film</title>
<!-- Rendered by story/render.js (Edge, headless): frame(t) paints a frame, then a screenshot is taken.
     Open in Edge started with --allow-file-access-from-files to scrub: index.html?t=12.5 , Space plays. -->
<style>
  :root {
    --blue: #3466f6; --violet: #8b5cf6; --sky: #84a9ff;
    --text: #eef0f6; --muted: #9aa3b5; --line: rgba(255,255,255,.09);
    --surface: #171a22; --surface2: #222632;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--text); font-family: var(--font); }
  #c { position: absolute; inset: 0; }
  #ui { position: absolute; inset: 0; }
  #grain { position: absolute; left: -40px; top: -40px; width: 2000px; height: 1160px; opacity: .06; mix-blend-mode: overlay; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(1300px 820px at 50% 50%, transparent 58%, rgba(0,0,0,.5)); }
  .grad { background: linear-gradient(90deg, #8fb2ff, #b79bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="ui"></div>
  <svg id="grain" width="2000" height="1160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="vignette"></div>
</div>
<script src="timeline.js"></script>
<script src="core.js"></script>
<script src="ch/pile.js"></script>
<script src="ch/intro.js" onerror="console.warn('no intro.js yet')"></script>
<script src="ch/ask.js" onerror="console.warn('no ask.js yet')"></script>
<script src="ch/brain.js" onerror="console.warn('no brain.js yet')"></script>
<script src="ch/finale.js" onerror="console.warn('no finale.js yet')"></script>
<script>
  // scrub / play when opened by hand
  ready.then(() => {
    const q = new URLSearchParams(location.search);
    let t = parseFloat(q.get("t") || "0"), playing = false, last = 0;
    frame(t);
    if (navigator.webdriver) return;
    addEventListener("keydown", (e) => {
      if (e.code === "Space") { playing = !playing; last = performance.now(); requestAnimationFrame(tick); }
      if (e.code === "ArrowRight") frame(t += 0.1);
      if (e.code === "ArrowLeft") frame(t -= 0.1);
    });
    function tick(now) {
      if (!playing) return;
      t += (now - last) / 1000; last = now;
      if (t > TL.DURATION) t = 0;
      frame(t); requestAnimationFrame(tick);
    }
  });
</script>
</body>
</html>
